{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BambangShop</title>
    <link rel="stylesheet" href="{% static 'catalog/css/style.css' %}">
    <style>
        .login-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px;
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            margin-bottom: 24px;
            text-align: center;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .alert {
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            margin-bottom: 16px;
        }
        .alert-error {
            background-color: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
<div class="container login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h1 class="login-title">Account Login</h1>
            <p class="login-subtitle">BambangShop Platform-Based Programming</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px;">
                <button type="submit" class="button button-primary" style="width: 100%;">Log In</button>
                <a href="{{ next }}" class="button button-secondary" style="width: 100%; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
