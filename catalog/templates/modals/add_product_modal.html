<!-- Add Product Modal -->
<div id="add-product-modal" class="modal-overlay hide">
    <div class="modal-card">
        <h2 class="modal-title">Add New Product</h2>
        <form id="product-form">
            <div class="form-group">
                <label for="product-name">Product Name</label>
                <input type="text" id="product-name" name="name" placeholder="e.g. Mechanical Keyboard" required />
            </div>
            <div class="form-group">
                <label for="product-sku">SKU Code</label>
                <input type="text" id="product-sku" name="sku" placeholder="e.g. KB-001" required />
            </div>
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <label for="product-category" style="margin-bottom: 0;">Category</label>
                    <button type="button" class="button button-sm button-secondary" id="quick-add-category-btn" style="padding: 2px 8px; font-size: 0.8rem;">+ New Category</button>
                </div>
                <select id="product-category" name="category" required>
                    <option value="">Select a category...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="product-price">Price ($)</label>
                <input type="number" id="product-price" name="price" step="0.01" min="0.01" placeholder="0.00" required />
            </div>
            <div class="form-group">
                <label for="product-stock">Initial Stock</label>
                <input type="number" id="product-stock" name="stock" step="1" min="0" value="0" required />
            </div>
            <div class="modal-footer">
                <button type="button" class="button button-secondary" id="close-modal-btn">Cancel</button>
                <button type="submit" class="button button-primary">Save Product</button>
            </div>
        </form>
    </div>
</div>
